<div class="alert-stack">
    {% for alert in checklist.alerts|default:execution.alerts %}
        <article class="alert-row tone-{{ alert.severity }}">
            <strong>{{ alert.title }}</strong>
            <p>{{ alert.description }}</p>
        </article>
    {% empty %}
        <article class="alert-row tone-info">
            <strong>Sem excecoes relevantes</strong>
            <p>A rotina esta sob controle, sem desvios operacionais expressivos neste momento.</p>
        </article>
    {% endfor %}
</div>
