<article class="maintenance-kpi-card tone-{{ kpi.tone }}">
    <div class="maintenance-kpi-top">
        <span class="stat-card-label">{{ kpi.label }}</span>
        <span class="status-badge status-dark">{{ kpi.badge }}</span>
    </div>
    <strong>{{ kpi.value }}</strong>
    <p class="maintenance-kpi-context">{{ kpi.context }}</p>
    <span class="maintenance-kpi-trend">{{ kpi.trend }}</span>
</article>
