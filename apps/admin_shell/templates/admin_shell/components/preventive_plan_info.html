<div class="asset-technical-grid">
    {% for item in preventive_plan.plan_info %}
        <article class="technical-stat {% if item.label == 'Descricao' or item.label == 'Observacoes tecnicas' %}technical-stat-wide{% endif %}">
            <span>{{ item.label }}</span>
            <strong>{{ item.value }}</strong>
        </article>
    {% endfor %}
</div>
