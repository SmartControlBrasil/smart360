<section class="widget-card">
    <div class="widget-head">
        <div>
            <h3>Receita mensal</h3>
            <p>Evolucao da receita operacional por periodo.</p>
        </div>
    </div>
    <div class="chart-bar-list">
        {% for point in revenue_series %}
            <article class="chart-bar-row">
                <div class="chart-bar-meta">
                    <strong>{{ point.label }}</strong>
                    <span>R$ {{ point.revenue }}</span>
                </div>
                <div class="chart-bar-track">
                    <span class="chart-bar-fill tone-emerald" style="width: {% widthratio point.revenue max_revenue 100 %}%"></span>
                </div>
            </article>
        {% endfor %}
    </div>
</section>
