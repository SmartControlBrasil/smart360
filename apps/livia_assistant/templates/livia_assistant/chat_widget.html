<div class="livia-widget livia-chat-widget" data-livia-widget data-endpoint="/livia/chat/">
  <section class="livia-chat-panel" id="livia-chat-panel" hidden data-livia-panel>
    <header class="livia-chat-header">
      <div>
        <strong>Lívia</strong>
        <span>Assistente da Smart Control Brasil</span>
      </div>
      <button class="livia-chat-minimize" type="button" data-livia-minimize aria-label="Minimizar chat">−</button>
    </header>
    <div class="livia-chat-messages" data-livia-messages aria-live="polite">
      <p class="livia-chat-message livia-chat-message-assistant">
        Olá, eu sou a Lívia 👋 Como posso ajudar?
      </p>
    </div>
    <p class="livia-chat-state" data-livia-state hidden></p>
    <form class="livia-chat-form" data-livia-form>
      <input type="text" name="message" placeholder="Digite sua mensagem" autocomplete="off" aria-label="Mensagem para a Lívia" required>
      <button type="submit" data-livia-submit>Enviar</button>
    </form>
  </section>
  <button class="livia-chat-toggle" type="button" aria-expanded="false" aria-controls="livia-chat-panel" data-livia-toggle>
    <span class="livia-chat-toggle-icon" aria-hidden="true"><i class="fa-solid fa-comments"></i></span>
    Fale com a Lívia
  </button>
</div>

<style>
  /* Posição/z-index definidos em static/institutional/eitech/css/scb-float-widgets.css */
  .livia-chat-toggle,
  .livia-chat-form button,
  .livia-chat-minimize {
    border: 0;
    cursor: pointer;
    font-weight: 700;
  }
  .livia-chat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 12px 18px;
    border-radius: 999px;
    background: #111827;
    color: #fff;
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.24);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
  }
  .livia-chat-toggle:hover,
  .livia-chat-toggle:focus {
    background: #1f2937;
    transform: translateY(-2px);
    box-shadow: 0 18px 36px rgba(15, 23, 42, 0.3);
  }
  .livia-chat-toggle-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: rgba(255, 255, 255, 0.95);
  }

  .livia-chat-panel {
    position: relative;
    width: min(360px, calc(100vw - 40px));
    margin-bottom: 12px;
    border: 1px solid #e6e8ef;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 22px 52px rgba(15, 23, 42, 0.24);
    overflow: hidden;
  }
  .livia-chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #111827, #0f766e);
    color: #fff;
  }
  .livia-chat-header div {
    display: grid;
    gap: 2px;
  }
  .livia-chat-header span {
    font-size: 12px;
    opacity: 0.84;
  }
  .livia-chat-minimize {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 20px;
    line-height: 1;
  }
  .livia-chat-messages {
    display: grid;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
    padding: 14px;
    background: #f8fafc;
  }
  .livia-chat-message {
    max-width: 86%;
    margin: 0;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .livia-chat-message-user {
    justify-self: end;
    background: #dcfce7;
    color: #14532d;
  }
  .livia-chat-message-assistant {
    justify-self: start;
    background: #fff;
    color: #111827;
    border: 1px solid #e5e7eb;
  }
  .livia-chat-state {
    margin: 0;
    padding: 8px 14px 0;
    color: #6b7280;
    font-size: 12px;
  }
  .livia-chat-state.is-error {
    color: #b91c1c;
  }
  .livia-chat-form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e6e8ef;
    background: #fff;
  }
  .livia-chat-form input {
    min-width: 0;
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 999px;
    padding: 10px 12px;
  }
  .livia-chat-form button {
    border-radius: 999px;
    background: linear-gradient(135deg, #0f766e, #0d5c56);
    color: #fff;
    padding: 10px 14px;
  }
  .livia-chat-form button:disabled {
    cursor: progress;
    opacity: 0.72;
  }
</style>

<script>
  (function () {
    const widget = document.querySelector("[data-livia-widget]");
    if (!widget || widget.dataset.initialized === "true") return;
    widget.dataset.initialized = "true";

    const endpoint = widget.dataset.endpoint || "/livia/chat/";
    const toggle = widget.querySelector("[data-livia-toggle]");
    const minimize = widget.querySelector("[data-livia-minimize]");
    const panel = widget.querySelector("[data-livia-panel]");
    const form = widget.querySelector("[data-livia-form]");
    const submit = widget.querySelector("[data-livia-submit]");
    const messages = widget.querySelector("[data-livia-messages]");
    const state = widget.querySelector("[data-livia-state]");
    let sessionKey = window.localStorage.getItem("livia_session_key") || "";
    let isLoading = false;

    function setOpen(open) {
      panel.toggleAttribute("hidden", !open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.toggleAttribute("hidden", open);
      if (open) {
        form.elements.message.focus();
      }
    }

    function setState(message, isError) {
      state.textContent = message || "";
      state.hidden = !message;
      state.classList.toggle("is-error", Boolean(isError));
    }

    function setLoading(loading) {
      isLoading = loading;
      submit.disabled = loading;
      setState(loading ? "Lívia está digitando..." : "", false);
    }

    function appendMessage(content, role) {
      const node = document.createElement("p");
      node.className = "livia-chat-message livia-chat-message-" + role;
      node.textContent = content;
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
    }

    toggle.addEventListener("click", function () { setOpen(true); });
    minimize.addEventListener("click", function () { setOpen(false); });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (isLoading) return;

      const input = form.elements.message;
      const message = input.value.trim();
      if (!message) {
        input.value = "";
        return;
      }

      appendMessage(message, "user");
      input.value = "";
      setLoading(true);

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message: message,
            session_key: sessionKey,
            source_page: window.location.pathname
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Falha ao enviar mensagem.");
        }
        if (data.session_key && !sessionKey) {
          sessionKey = data.session_key;
          window.localStorage.setItem("livia_session_key", sessionKey);
        }
        appendMessage(data.reply || "Não consegui responder agora. Tente novamente em instantes.", "assistant");
      } catch (error) {
        setState("Não consegui enviar agora. Tente novamente em instantes.", true);
      } finally {
        setLoading(false);
      }
    });
  })();
</script>
