name: smart360-dev

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: /app/deployment/scripts/start-web.sh
    env_file:
      - ../env/.env.dev.example
    volumes:
      - ../..:/app
      - smart360_dev_static:/app/staticfiles
      - smart360_dev_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python manage.py shell -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: /app/deployment/scripts/start-worker.sh
    env_file:
      - ../env/.env.dev.example
    volumes:
      - ../..:/app
      - smart360_dev_static:/app/staticfiles
      - smart360_dev_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: /app/deployment/scripts/start-beat.sh
    env_file:
      - ../env/.env.dev.example
    volumes:
      - ../..:/app
      - smart360_dev_static:/app/staticfiles
      - smart360_dev_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart360
      POSTGRES_USER: smart360
      POSTGRES_PASSWORD: smart360
    ports:
      - "5432:5432"
    volumes:
      - smart360_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart360 -d smart360"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - smart360_dev_redis:/data

volumes:
  smart360_dev_postgres:
  smart360_dev_redis:
  smart360_dev_static:
  smart360_dev_media:
