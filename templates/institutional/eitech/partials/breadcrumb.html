{% load static %}
<div class="inner-page-hero-area scb-inner-hero-bg">
  <img src="{% static 'institutional/eitech/img/elements/elements5.png' %}" alt="" aria-hidden="true" class="elements5">
  <img src="{% static 'institutional/eitech/img/elements/elements4.png' %}" alt="" aria-hidden="true" class="elements4">
  <img src="{% static 'institutional/eitech/img/elements/elements1.png' %}" alt="" aria-hidden="true" class="elements1 keyframe5">
  <img src="{% static 'institutional/eitech/img/elements/elements16.png' %}" alt="" aria-hidden="true" class="elements16">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 m-auto">
        <div class="inner-header text-center heading1">
          <h1>{{ title }}</h1>
          <div class="space28"></div>
          <a href="{% url 'institutional:home' %}">Home <i class="fa-solid fa-angle-right"></i> <span>{{ title }}</span></a>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'institutional:home' %}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ title|escapejs }}",
      "item": "{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
    }
  ]
}
</script>
